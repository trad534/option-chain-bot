name: Angel One Live Option Chain Auto-Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * 1-5'

jobs:
  run-angel-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo content
        uses: actions/checkout@v3

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp logzero websocket-client pandas scipy numpy gspread google-auth

      - name: Run Angel Option Chain Engine
        env:
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python angel_login.py
