name: Angel One Daily Login & Fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'

jobs:
  run-angel-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo content
        uses: actions/checkout@v3

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install smartapi-python pyotp logzero websocket-client pandas

      - name: Run Option Chain Script
        env:
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python angel_login.py

      - name: Commit and Push Generated Option Chain CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nifty_option_chain.csv
          git commit -m "Auto-update NIFTY Option Chain Data" || echo "No changes to commit"
          git push
